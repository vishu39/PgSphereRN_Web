<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="topSphereNR" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="glowNR" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="shadowNR" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#10b981" flood-opacity="0.45"/>
    </filter>
  </defs>
  
  <circle cx="50" cy="50" r="44" stroke="#059669" stroke-width="2" fill="#0b0d11" filter="url(#shadowNR)" />
  
  <!-- Upper hemisphere -->
  <path d="M 10 50 A 40 40 0 0 1 90 50 Z" fill="url(#topSphereNR)" opacity="0.95" />
  
  <!-- Lower hemisphere -->
  <path d="M 10 50 A 40 40 0 0 0 90 50 Z" fill="#141824" />
  
  <!-- Center band -->
  <rect x="6" y="46" width="88" height="8" fill="#090b0e" rx="2" />
  
  <!-- Center button with NR indicator -->
  <circle cx="50" cy="50" r="14" fill="#090b0e" stroke="#38bdf8" stroke-width="2.5" />
  <circle cx="50" cy="50" r="8" fill="url(#glowNR)" />
  <circle cx="50" cy="50" r="4" fill="#ffffff" />
</svg>

